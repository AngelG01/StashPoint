{% extends "base/base.html" %}

{% block title %}My Files{% endblock %}

{% block content %}
<h1>My Files</h1>
<a href="{% url 'vault:upload' %}">Upload new file</a>
<ul>
{% for file in files %}
    <li>
        {{ file.original_filename }} — {{ file.uploaded_at }}
        <a href="{{ file.file.url }}" target="_blank">Download</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
