{% extends "base/base.html" %}

{% block title %}My Files{% endblock %}

{% block content %}
<h1>My Files</h1>
<a class="upload-link" href="{% url 'vault:upload' %}">Upload new file</a>
<ul class="file-list">
{% for file in files %}
    <li>
        <span>{{ file.original_filename }}</span>
        <span class="file-meta">{{ file.uploaded_at }} — <a href="{{ file.file.url }}" target="_blank">View</a></span>
    </li>
{% endfor %}
</ul>
{% endblock %}
