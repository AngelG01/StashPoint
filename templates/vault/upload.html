{% extends "base/base.html" %}

{% block title %}Upload{% endblock %}

{% block content %}
<h1>Upload a file</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>
<a href="{% url 'vault:gallery' %}">View my files</a>
{% endblock %}
