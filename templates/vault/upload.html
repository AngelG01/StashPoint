{% extends "base/base.html" %}

{% block title %}Upload{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Upload a File</h1>
</div>
<div class="card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Upload</button>
    </form>
</div>
{% endblock %}
