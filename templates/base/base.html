{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StashPoint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="topnav">
        <a class="brand" href="{% if user.is_authenticated %}{% url 'vault:gallery' %}{% else %}{% url 'login' %}{% endif %}">
            <span class="brand-mark">SP</span>
            StashPoint
        </a>
        {% if user.is_authenticated %}
        <div class="nav-links">
            <a href="{% url 'vault:gallery' %}">Gallery</a>
            <a href="{% url 'vault:upload' %}">Upload</a>
        </div>
        {% endif %}
        <div class="nav-right">
            {% if user.is_authenticated %}
                <div class="user-chip">
                    <span class="avatar">{{ user.username|first|upper }}</span>
                    {{ user.username }}
                </div>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn-link">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:sign_up' %}" class="btn-link">Sign up</a>
            {% endif %}
        </div>
    </nav>
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
