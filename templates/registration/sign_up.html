{% extends "base/base.html" %}

{% block title %}Sign Up{% endblock %}
{% block main_class %}auth-main{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Join your family's private cloud</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-full">Sign Up</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
